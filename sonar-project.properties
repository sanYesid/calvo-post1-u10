# ============================================================
# Configuración de análisis SonarQube — envios-service
# El token NO se guarda aquí: se pasa por línea de comandos
# con -Dsonar.token=TU_TOKEN para no exponerlo en el repositorio.
# ============================================================

# Identificación del proyecto en SonarQube
sonar.projectKey=com.universidad:envios-service
sonar.projectName=Envios Service
sonar.projectVersion=1.0

# Código fuente de producción y pruebas
sonar.sources=src/main/java
sonar.tests=src/test/java

# Clases compiladas (necesarias para el análisis de reglas de Java)
sonar.java.binaries=target/classes

# Reporte de cobertura generado por JaCoCo (mvn clean verify)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Servidor SonarQube local (Docker)
sonar.host.url=http://localhost:9000

# No esperar el resultado del Quality Gate al terminar el análisis
sonar.qualitygate.wait=false

# Exclusiones: ninguna (ver Decisión de diseño 2 en el README).
# El proyecto no tiene clase Main ni código sin lógica de negocio.
# sonar.exclusions=